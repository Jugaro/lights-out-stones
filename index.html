<link rel="manifest" href="manifest.json">
<style>
  :root {
    --wood-1: #eed9ae;
    --wood-2: #e2bd7f;
    --wood-3: #d9ad6c;
    --line: rgba(92, 58, 28, 0.75);
    --ink: #4a3626;
    --stone-black-1: #555;
    --stone-black-2: #1a1a1c;
    --stone-white-1: #ffffff;
    --stone-white-2: #d9d4c8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background:
      radial-gradient(ellipse at 20% 10%, #f7ecd2 0%, transparent 55%),
      linear-gradient(160deg, var(--wood-1) 0%, var(--wood-2) 55%, var(--wood-3) 100%);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 18px 14px 30px;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  h1 {
    font-size: clamp(22px, 5vw, 34px);
    letter-spacing: 0.12em;
    font-weight: normal;
    text-shadow: 0 1px 0 rgba(255,255,255,0.5);
  }
  .subtitle {
    font-style: italic;
    opacity: 0.65;
    font-size: clamp(12px, 3vw, 15px);
    margin-top: 2px;
    letter-spacing: 0.08em;
  }
  /* ---------- Панель управления ---------- */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin: 14px 0 8px;
    max-width: 560px;
  }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button {
    font-family: inherit; font-size: 14px; padding: 7px 12px;
    background: rgba(255, 251, 240, 0.55); color: var(--ink);
    border: none; cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.active { background: var(--ink); color: #f5e9d0; }
  .btn {
    font-family: inherit; font-size: 14px; padding: 7px 14px;
    background: rgba(255, 251, 240, 0.75);
    color: var(--ink); border: 1px solid var(--line); border-radius: 8px;
    cursor: pointer; transition: background 0.15s, transform 0.1s;
  }
  .btn:hover { background: #fffaf0; }
  .btn:active { transform: scale(0.96); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.small { font-size: 12.5px; padding: 5px 10px; }
  /* ---------- Статистика партии ---------- */
  .stats {
    display: flex; gap: 18px; font-size: 15px; margin: 4px 0 12px;
    font-variant-numeric: tabular-nums;
  }
  .stats b { font-weight: normal; opacity: 0.65; font-size: 12px; display: block; text-align: center; letter-spacing: 0.1em; }
  .stats span { display: block; text-align: center; font-size: 18px; }
  /* ---------- Сцена: доска + аромапалочка ---------- */
  .scene { display: flex; align-items: center; gap: clamp(10px, 3vw, 26px); }
  .board-frame {
    padding: clamp(10px, 2.5vw, 18px);
    border-radius: 10px;
    background:
      repeating-linear-gradient(90deg, rgba(140,95,45,0.16) 0 2px, transparent 2px 26px),
      linear-gradient(145deg, #caa06a, #b3854e);
    box-shadow:
      0 10px 24px rgba(60, 35, 10, 0.35),
      inset 0 2px 3px rgba(255, 235, 200, 0.5),
      inset 0 -2px 4px rgba(80, 50, 20, 0.4);
  }
  .board {
    position: relative;
    display: grid;
    width: min(78vw, 420px);
    aspect-ratio: 1;
    border-radius: 4px;
    background:
      radial-gradient(circle at 30% 25%, rgba(255, 240, 205, 0.5), transparent 60%),
      linear-gradient(150deg, #eccf95, #ddb271 70%, #d3a45f);
    box-shadow: inset 0 0 0 1px rgba(92, 58, 28, 0.35), inset 0 2px 10px rgba(120, 80, 35, 0.25);
  }
  .cell {
    position: relative;
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 0;
    outline: none;
  }
  .cell:focus-visible .stone { box-shadow: 0 0 0 2px #7a5; }
  .stone {
    position: absolute;
    inset: 7%;
    border-radius: 50%;
    transition: transform 0.18s ease;
  }
  .cell:active .stone { transform: scale(0.9); }
  .face {
    position: absolute; inset: 0; border-radius: 50%;
    transition: opacity 0.28s ease;
    backface-visibility: hidden;
  }
  .face.white {
    background: radial-gradient(circle at 34% 28%, var(--stone-white-1) 0%, #efece4 45%, var(--stone-white-2) 100%);
    box-shadow: 0 2px 4px rgba(60, 35, 10, 0.45), inset 0 -2px 3px rgba(150, 140, 120, 0.5);
    opacity: 1;
  }
  .face.black {
    background: radial-gradient(circle at 34% 28%, var(--stone-black-1) 0%, #333 40%, var(--stone-black-2) 100%);
    box-shadow: 0 2px 4px rgba(60, 35, 10, 0.55), inset 0 -2px 3px rgba(0, 0, 0, 0.6);
    opacity: 0;
  }
  .cell.black .face.white { opacity: 0; }
  .cell.black .face.black { opacity: 1; }
  .cell.pressed .stone { animation: flipPulse 0.28s ease; }
  @keyframes flipPulse {
    0% { transform: scaleY(1); }
    45% { transform: scaleY(0.55); }
    100% { transform: scaleY(1); }
  }
  /* ---------- Аромапалочка ---------- */
  .incense-wrap {
    display: flex; flex-direction: column; align-items: center;
    align-self: stretch; justify-content: flex-end; padding-bottom: 8px;
  }
  .smoke { position: relative; width: 8px; height: 90px; margin-bottom: -6px; }
  .smoke i {
    position: absolute; left: 50%; bottom: 0;
    width: 7px; height: 7px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.75);
    filter: blur(3px);
    opacity: 0;
    animation: rise 4s infinite ease-in;
  }
  .smoke i:nth-child(2) { animation-delay: 1.3s; }
  .smoke i:nth-child(3) { animation-delay: 2.6s; }
  @keyframes rise {
    0%   { transform: translate(0, 0) scale(0.6); opacity: 0; }
    15%  { opacity: 0.8; }
    60%  { transform: translate(-7px, -46px) scale(1.5); opacity: 0.4; }
    100% { transform: translate(6px, -88px) scale(2.2); opacity: 0; }
  }
  .stick {
    width: 6px; height: 110px;
    border-radius: 3px 3px 0 0;
    background: linear-gradient(90deg, #6e3f1f, #a06a3a 45%, #5c3319);
    position: relative;
  }
  .stick::before {
    content: '';
    position: absolute; top: -5px; left: 50%; transform: translateX(-50%);
    width: 7px; height: 7px; border-radius: 50%;
    background: radial-gradient(circle, #ffd98a 0%, #ff8c2e 55%, rgba(200, 60, 10, 0.9) 100%);
    animation: ember 2.2s infinite ease-in-out;
  }
  @keyframes ember {
    0%, 100% { box-shadow: 0 0 4px 1px rgba(255, 150, 50, 0.7); }
    50% { box-shadow: 0 0 9px 3px rgba(255, 120, 30, 0.95); }
  }
  .holder {
    width: 26px; height: 12px; border-radius: 0 0 8px 8px;
    background: linear-gradient(180deg, #8a5a30, #5f3c1c);
    box-shadow: 0 2px 3px rgba(60, 35, 10, 0.4);
  }
  /* ---------- Оверлеи ---------- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(50, 32, 14, 0.55);
    backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center;
    z-index: 10; padding: 20px;
  }
  .overlay.show { display: flex; }
  .card {
    background: linear-gradient(160deg, #fbf3df, #f0dfb8);
    border: 1px solid var(--line); border-radius: 14px;
    padding: 26px 30px; text-align: center;
    box-shadow: 0 18px 50px rgba(40, 22, 5, 0.5);
    max-width: 420px; width: 100%;
    max-height: 85vh; overflow-y: auto;
  }
  .card h2 { font-weight: normal; letter-spacing: 0.15em; margin-bottom: 6px; }
  .card .zen { font-style: italic; opacity: 0.65; margin-bottom: 14px; font-size: 14px; }
  .card .big { font-size: 20px; margin: 10px 0; }
  .card .record { color: #9a5b12; font-size: 15px; margin-bottom: 10px; min-height: 20px; }
  .card .row { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
  table.wins { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-top: 8px; }
  table.wins th, table.wins td { padding: 5px 6px; border-bottom: 1px solid rgba(92,58,28,0.25); }
  table.wins th { opacity: 0.6; font-weight: normal; letter-spacing: 0.06em; font-size: 11.5px; }
  .empty { font-style: italic; opacity: 0.55; margin: 12px 0; }
  .menu-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin: 10px 0;
  }
  .menu-label { font-size: 14px; letter-spacing: 0.08em; opacity: 0.75; }
  .menu-note {
    font-size: 12.5px; font-style: italic; opacity: 0.6;
    margin: 12px 0 2px; line-height: 1.45;
  }
</style>
</head>
<body>

<h1>Lights Out Stones</h1>
<div class="subtitle" id="subtitle">◈ восточная головоломка · переверните все камни в белые</div>

<div class="controls">
  <div class="seg" id="levelSeg">
    <button data-n="3">3×3</button>
    <button data-n="5" class="active">5×5</button>
    <button data-n="7">7×7</button>
  </div>
  <button class="btn small" id="undoBtn">↩ Отменить ход</button>
  <button class="btn small" id="newBtn">Новая игра</button>
  <button class="btn small" id="pauseBtn">⏸ Пауза</button>
  <button class="btn small" id="menuBtn">☰ Меню</button>
</div>

<div class="stats">
  <div><b>ХОДЫ</b><span id="moves">0</span></div>
  <div><b>ВРЕМЯ</b><span id="time">0:00</span></div>
  <div><b>РЕКОРД</b><span id="best">—</span></div>
</div>

<div class="scene">
  <div class="board-frame">
    <div class="board" id="board"></div>
  </div>
  <div class="incense-wrap" aria-hidden="true">
    <div class="smoke"><i></i><i></i><i></i></div>
    <div class="stick"></div>
    <div class="holder"></div>
  </div>
</div>

<!-- Победа -->
<div class="overlay" id="winOverlay">
  <div class="card">
    <h2>ПОБЕДА</h2>
    <div class="zen" id="winZen">все камни обратились свету</div>
    <div class="big" id="winDetails"></div>
    <div class="record" id="winRecord"></div>
    <div class="row">
      <button class="btn" id="againBtn">Играть снова</button>
      <button class="btn" id="nextBtn">Следующий уровень</button>
    </div>
  </div>
</div>

<!-- Статистика -->
<div class="overlay" id="statsOverlay">
  <div class="card">
    <h2>СТАТИСТИКА</h2>
    <div class="zen">список побед</div>
    <div id="winsBody"></div>
    <div class="row">
      <button class="btn small" id="resetStatsBtn">Сбросить рекорды</button>
      <button class="btn" id="closeStatsBtn">Закрыть</button>
    </div>
  </div>
</div>

<!-- Пауза -->
<div class="overlay" id="pauseOverlay">
  <div class="card">
    <h2>ПАУЗА</h2>
    <div class="zen">пусть доска подождёт — мысль догонит</div>
    <div class="row">
      <button class="btn" id="resumeBtn">Продолжить</button>
      <button class="btn" id="pauseMenuBtn">Меню</button>
    </div>
  </div>
</div>

<!-- Меню -->
<div class="overlay" id="menuOverlay">
  <div class="card">
    <h2>МЕНЮ</h2>
    <div class="zen">настройки игры</div>
    <div class="menu-row">
      <div class="menu-label">Режим</div>
      <div class="seg" id="modeSeg">
        <button data-mode="rays" class="active">Лучи</button>
        <button data-mode="cross">Крест</button>
      </div>
    </div>
    <div class="menu-row">
      <div class="menu-label">Сложность</div>
      <div class="seg" id="diffSeg">
        <button data-diff="easy">Легко</button>
        <button data-diff="medium" class="active">Средне</button>
        <button data-diff="hard">Тяжело</button>
      </div>
    </div>
    <div class="menu-row">
      <div class="menu-label">Цель</div>
      <div class="seg" id="targetSeg">
        <button data-target="white" class="active">⚪ Белые</button>
        <button data-target="black">⚫ Чёрные</button>
      </div>
    </div>
    <div class="menu-row">
      <div class="menu-label">Звук</div>
      <div class="seg" id="soundSeg">
        <button data-sound="on" class="active">Вкл</button>
        <button data-sound="off">Выкл</button>
      </div>
    </div>
    <div class="menu-note" id="modeNote"></div>
    <div class="row">
      <button class="btn small" id="menuStatsBtn">Статистика</button>
      <button class="btn small" id="menuNewBtn">Новая игра</button>
      <button class="btn" id="closeMenuBtn">Закрыть</button>
    </div>
  </div>
</div>

<script src="game.js"></script>
<script>
(function () {
  'use strict';
  var L = window.LightsOutLogic;

  // Диапазоны числа случайных нажатий при генерации: режим → сложность → размер.
  // Меньше нажатий — проще партия; «лучи» перемешивают сильнее, поэтому там меньше.
  var PRESSES = {
    cross: {
      easy:   { 3: [2, 3],  5: [4, 6],  7: [6, 9] },
      medium: { 3: [4, 6],  5: [8, 12], 7: [12, 16] },
      hard:   { 3: [7, 9],  5: [14, 18], 7: [18, 24] }
    },
    rays: {
      easy:   { 3: [1, 2], 5: [2, 3], 7: [3, 4] },
      medium: { 3: [2, 3], 5: [3, 5], 7: [4, 6] },
      hard:   { 3: [4, 5], 5: [6, 8], 7: [7, 10] }
    }
  };
  var LEVELS = [3, 5, 7];
  var DIFFS = ['easy', 'medium', 'hard'];
  var MODE_NOTES = {
    rays: 'Лучи: нажатие переворачивает все камни своей строки и своего столбца.',
    cross: 'Крест: нажатие переворачивает камень и его ближайших соседей по вертикали и горизонтали.'
  };

  var state = {
    n: 5,
    mode: localStorage.getItem('los_mode') === 'cross' ? 'cross' : 'rays',
    diff: DIFFS.indexOf(localStorage.getItem('los_diff')) >= 0 ? localStorage.getItem('los_diff') : 'medium',
    target: localStorage.getItem('los_target') === 'black' ? 'black' : 'white',
    sound: localStorage.getItem('los_sound') !== 'off',
    board: [],
    moves: 0,
    history: [],
    timerId: null,
    startedAt: null,
    elapsed: 0,
    locked: false,
    paused: false
  };

  function targetColor() { return state.target === 'black' ? L.BLACK : L.WHITE; }

  var els = {
    board: document.getElementById('board'),
    moves: document.getElementById('moves'),
    time: document.getElementById('time'),
    best: document.getElementById('best'),
    undo: document.getElementById('undoBtn'),
    win: document.getElementById('winOverlay'),
    winDetails: document.getElementById('winDetails'),
    winRecord: document.getElementById('winRecord'),
    stats: document.getElementById('statsOverlay'),
    winsBody: document.getElementById('winsBody'),
    pause: document.getElementById('pauseOverlay'),
    menu: document.getElementById('menuOverlay'),
    modeNote: document.getElementById('modeNote'),
    subtitle: document.getElementById('subtitle'),
    winZen: document.getElementById('winZen')
  };

  /* ---------- Хранилище рекордов ---------- */
  // Рекорд зависит от всех параметров партии, иначе «легко» бьёт рекорд «тяжело»
  function bestKey(n) {
    return 'los_best_' + n + '_' + state.mode + '_' + state.diff + '_' + state.target;
  }
  function getBest(n) {
    var v = localStorage.getItem(bestKey(n));
    return v === null ? null : Number(v);
  }
  function getWins() {
    try { return JSON.parse(localStorage.getItem('los_wins') || '[]'); }
    catch (e) { return []; }
  }
  function addWin(entry) {
    var wins = getWins();
    wins.unshift(entry);
    localStorage.setItem('los_wins', JSON.stringify(wins.slice(0, 200)));
  }

  /* ---------- Звук (Web Audio, без файлов) ---------- */
  var actx = null;
  function audio() {
    if (!actx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) actx = new AC();
    }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  function sndClick() {
    if (!state.sound) return;
    var ctx = audio(); if (!ctx) return;
    var t = ctx.currentTime;
    // деревянный щелчок: короткий шумовой импульс + низкий тон
    var len = Math.floor(ctx.sampleRate * 0.06);
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var noise = ctx.createBufferSource(); noise.buffer = buf;
    var nf = ctx.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 900; nf.Q.value = 2;
    var ng = ctx.createGain();
    ng.gain.setValueAtTime(0.5, t);
    ng.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
    noise.connect(nf); nf.connect(ng); ng.connect(ctx.destination);
    noise.start(t);
    var osc = ctx.createOscillator(); osc.type = 'sine'; osc.frequency.value = 160;
    var og = ctx.createGain();
    og.gain.setValueAtTime(0.25, t);
    og.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    osc.connect(og); og.connect(ctx.destination);
    osc.start(t); osc.stop(t + 0.13);
  }
  function sndWin() {
    if (!state.sound) return;
    var ctx = audio(); if (!ctx) return;
    // пентатоническое арпеджио — восточный оттенок
    var notes = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];
    notes.forEach(function (f, i) {
      var t = ctx.currentTime + i * 0.16;
      var osc = ctx.createOscillator(); osc.type = 'triangle'; osc.frequency.value = f;
      var g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(t); osc.stop(t + 0.65);
    });
  }

  /* ---------- Таймер ---------- */
  function fmtTime(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  function startTimer() {
    if (state.timerId) return;
    // startedAt в прошлом на величину уже накопленного времени — таймер корректно продолжается после паузы
    state.startedAt = Date.now() - state.elapsed * 1000;
    state.timerId = setInterval(function () {
      state.elapsed = Math.floor((Date.now() - state.startedAt) / 1000);
      els.time.textContent = fmtTime(state.elapsed);
    }, 500);
  }
  function stopTimer() {
    if (state.timerId) { clearInterval(state.timerId); state.timerId = null; }
    if (state.startedAt) {
      state.elapsed = Math.floor((Date.now() - state.startedAt) / 1000);
      state.startedAt = null;
    }
  }

  /* ---------- Отрисовка ---------- */
  function paintGrid() {
    var n = state.n;
    var lines = [];
    for (var i = 0; i < n; i++) {
      var p = ((i + 0.5) / n * 100).toFixed(3) + '%';
      lines.push('linear-gradient(to right, transparent ' + p + ', var(--line) ' + p + ', var(--line) calc(' + p + ' + 1.6px), transparent calc(' + p + ' + 1.6px))');
      lines.push('linear-gradient(to bottom, transparent ' + p + ', var(--line) ' + p + ', var(--line) calc(' + p + ' + 1.6px), transparent calc(' + p + ' + 1.6px))');
    }
    // хоси (звёздные точки), как на досках для го
    var stars = { 3: [1], 5: [2], 7: [3] }[n] || [];
    stars.forEach(function (r) {
      stars.forEach(function (c) {
        var x = ((c + 0.5) / n * 100).toFixed(3) + '%';
        var y = ((r + 0.5) / n * 100).toFixed(3) + '%';
        lines.push('radial-gradient(circle at ' + x + ' ' + y + ', var(--line) 0 3px, transparent 3.5px)');
      });
    });
    els.board.style.backgroundImage = lines.join(', ');
  }

  function render(pressedIdx) {
    var n = state.n;
    els.board.style.gridTemplateColumns = 'repeat(' + n + ', 1fr)';
    els.board.innerHTML = '';
    for (var r = 0; r < n; r++) {
      for (var c = 0; c < n; c++) {
        (function (r, c) {
          var idx = r * n + c;
          var cell = document.createElement('button');
          cell.className = 'cell' + (state.board[idx] === L.BLACK ? ' black' : '');
          cell.setAttribute('aria-label', 'камень ' + (r + 1) + '-' + (c + 1));
          if (idx === pressedIdx) {
            cell.classList.add('pressed');
            setTimeout(function () { cell.classList.remove('pressed'); }, 300);
          }
          var stone = document.createElement('span');
          stone.className = 'stone';
          stone.innerHTML = '<span class="face white"></span><span class="face black"></span>';
          cell.appendChild(stone);
          cell.addEventListener('click', function () { onPress(r, c); });
          els.board.appendChild(cell);
        })(r, c);
      }
    }
    els.moves.textContent = state.moves;
    els.undo.disabled = state.history.length === 0;
  }

  function renderBest() {
    var b = getBest(state.n);
    els.best.textContent = b === null ? '—' : fmtTime(b);
  }

  /* ---------- Логика партии ---------- */
  function newGame() {
    stopTimer();
    var n = state.n;
    var color = targetColor();
    var range = PRESSES[state.mode][state.diff][n];
    // защита от случайно «пустой» генерации (нажатия сократились до нуля):
    // перегенерируем, пока стартовая позиция не станет нерешённой
    var board, num, tries = 0;
    do {
      num = range[0] + Math.floor(Math.random() * (range[1] - range[0] + 1));
      board = L.generateBoard(n, num, Math.random, state.mode, color);
      tries++;
    } while (L.isWin(board, color) && tries < 20);
    state.board = board;
    state.moves = 0;
    state.history = [];
    state.elapsed = 0;
    state.locked = false;
    state.paused = false;
    pauseBtn.textContent = '⏸ Пауза';
    els.time.textContent = '0:00';
    els.win.classList.remove('show');
    els.pause.classList.remove('show');
    els.subtitle.textContent = state.target === 'black'
      ? '◈ восточная головоломка · переверните все камни в чёрные'
      : '◈ восточная головоломка · переверните все камни в белые';
    paintGrid();
    render();
    renderBest();
  }

  function onPress(r, c) {
    if (state.locked || state.paused) return;
    if (state.moves === 0 && !state.startedAt) startTimer();
    state.history.push(state.board.slice());
    state.board = L.applyPress(state.board, state.n, r, c, state.mode);
    state.moves++;
    sndClick();
    render(r * state.n + c);
    if (L.isWin(state.board, targetColor())) onWin();
  }

  function onUndo() {
    if (state.locked || state.history.length === 0) return;
    state.board = state.history.pop();
    state.moves = Math.max(0, state.moves - 1);
    sndClick();
    render();
  }

  function onWin() {
    state.locked = true;
    stopTimer();
    sndWin();
    var n = state.n;
    var prev = getBest(n);
    var isRecord = prev === null || state.elapsed < prev;
    if (isRecord) localStorage.setItem(bestKey(n), String(state.elapsed));
    addWin({ date: new Date().toISOString().slice(0, 10), level: n, mode: state.mode, diff: state.diff, target: state.target, time: state.elapsed, moves: state.moves });
    els.winZen.textContent = state.target === 'black'
      ? 'все камни обратились тени'
      : 'все камни обратились свету';
    els.winDetails.textContent = 'Уровень ' + n + '×' + n + ' · ' +
      fmtTime(state.elapsed) + ' · ' + state.moves + ' ходов';
    els.winRecord.textContent = isRecord ? '✦ Новый рекорд! ✦' : 'Рекорд: ' + fmtTime(prev);
    renderBest();
    setTimeout(function () { els.win.classList.add('show'); }, 450);
  }

  /* ---------- Статистика ---------- */
  function renderStats() {
    var wins = getWins();
    if (wins.length === 0) {
      els.winsBody.innerHTML = '<div class="empty">Пока нет побед — доска ждёт.</div>';
      return;
    }
    var rows = wins.map(function (w) {
      var mode = w.mode === 'cross' ? 'крест' : (w.mode === 'rays' ? 'лучи' : '—');
      return '<tr><td>' + w.date + '</td><td>' + w.level + '×' + w.level + '</td><td>' +
        mode + '</td><td>' + fmtTime(w.time) + '</td><td>' + w.moves + '</td></tr>';
    }).join('');
    els.winsBody.innerHTML =
      '<table class="wins"><tr><th>ДАТА</th><th>УРОВЕНЬ</th><th>РЕЖИМ</th><th>ВРЕМЯ</th><th>ХОДЫ</th></tr>' + rows + '</table>';
  }

  /* ---------- Пауза ---------- */
  var pauseBtn = document.getElementById('pauseBtn');
  function pauseGame() {
    if (state.paused || state.locked) return;
    state.paused = true;
    stopTimer();
    pauseBtn.textContent = '▶ Продолжить';
    els.pause.classList.add('show');
  }
  function resumeGame() {
    if (!state.paused) return;
    state.paused = false;
    pauseBtn.textContent = '⏸ Пауза';
    els.pause.classList.remove('show');
    if (state.moves > 0) startTimer(); // таймер продолжает с накопленного времени
  }

  /* ---------- Меню ---------- */
  function syncMenu() {
    document.querySelectorAll('#modeSeg button').forEach(function (b) {
      b.classList.toggle('active', b.dataset.mode === state.mode);
    });
    document.querySelectorAll('#diffSeg button').forEach(function (b) {
      b.classList.toggle('active', b.dataset.diff === state.diff);
    });
    document.querySelectorAll('#targetSeg button').forEach(function (b) {
      b.classList.toggle('active', b.dataset.target === state.target);
    });
    document.querySelectorAll('#soundSeg button').forEach(function (b) {
      b.classList.toggle('active', (b.dataset.sound === 'on') === state.sound);
    });
    els.modeNote.textContent = MODE_NOTES[state.mode];
  }

  /* ---------- События ---------- */
  document.getElementById('levelSeg').addEventListener('click', function (e) {
    var btn = e.target.closest('button'); if (!btn) return;
    state.n = Number(btn.dataset.n);
    var seg = document.getElementById('levelSeg');
    seg.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b === btn); });
    newGame();
  });
  els.undo.addEventListener('click', onUndo);
  document.getElementById('newBtn').addEventListener('click', newGame);
  document.getElementById('againBtn').addEventListener('click', newGame);
  document.getElementById('nextBtn').addEventListener('click', function () {
    var i = LEVELS.indexOf(state.n);
    state.n = LEVELS[(i + 1) % LEVELS.length];
    document.getElementById('levelSeg').querySelectorAll('button').forEach(function (b) {
      b.classList.toggle('active', Number(b.dataset.n) === state.n);
    });
    newGame();
  });
  /* Пауза */
  document.getElementById('pauseBtn').addEventListener('click', function () {
    if (state.paused) { resumeGame(); } else { pauseGame(); }
  });
  document.getElementById('resumeBtn').addEventListener('click', resumeGame);
  document.getElementById('pauseMenuBtn').addEventListener('click', function () {
    els.pause.classList.remove('show');
    syncMenu();
    els.menu.classList.add('show');
  });
  /* Меню */
  document.getElementById('menuBtn').addEventListener('click', function () {
    syncMenu();
    els.menu.classList.add('show');
  });
  document.getElementById('closeMenuBtn').addEventListener('click', function () {
    els.menu.classList.remove('show');
  });
  document.getElementById('menuNewBtn').addEventListener('click', function () {
    els.menu.classList.remove('show');
    newGame();
  });
  document.getElementById('menuStatsBtn').addEventListener('click', function () {
    els.menu.classList.remove('show');
    renderStats();
    els.stats.classList.add('show');
  });
  document.getElementById('modeSeg').addEventListener('click', function (e) {
    var btn = e.target.closest('button'); if (!btn) return;
    if (btn.dataset.mode === state.mode) return;
    state.mode = btn.dataset.mode;
    localStorage.setItem('los_mode', state.mode);
    syncMenu();
    newGame();
  });
  document.getElementById('diffSeg').addEventListener('click', function (e) {
    var btn = e.target.closest('button'); if (!btn) return;
    if (btn.dataset.diff === state.diff) return;
    state.diff = btn.dataset.diff;
    localStorage.setItem('los_diff', state.diff);
    syncMenu();
    newGame();
  });
  document.getElementById('targetSeg').addEventListener('click', function (e) {
    var btn = e.target.closest('button'); if (!btn) return;
    if (btn.dataset.target === state.target) return;
    state.target = btn.dataset.target;
    localStorage.setItem('los_target', state.target);
    syncMenu();
    newGame();
  });
  document.getElementById('soundSeg').addEventListener('click', function (e) {
    var btn = e.target.closest('button'); if (!btn) return;
    state.sound = btn.dataset.sound === 'on';
    localStorage.setItem('los_sound', state.sound ? 'on' : 'off');
    syncMenu();
    if (state.sound) sndClick();
  });
  /* Автопауза при сворачивании вкладки */
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && !state.locked && state.moves > 0 && !state.paused) pauseGame();
  });
  document.getElementById('closeStatsBtn').addEventListener('click', function () {
    els.stats.classList.remove('show');
  });
  document.getElementById('resetStatsBtn').addEventListener('click', function () {
    if (!confirm('Сбросить все рекорды и список побед?')) return;
    Object.keys(localStorage).forEach(function (k) {
      if (k.indexOf('los_best_') === 0) localStorage.removeItem(k);
    });
    localStorage.removeItem('los_wins');
    renderStats(); renderBest();
  });
  [els.win, els.stats, els.pause, els.menu].forEach(function (ov) {
    ov.addEventListener('click', function (e) { if (e.target === ov) ov.classList.remove('show'); });
  });

  /* ---------- Service worker (только по http/https) ---------- */
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    // новая версия SW активировалась и перехватила контроль — один раз перезагружаемся,
    // чтобы пользователь сразу видел свежую версию вместо старой из кэша
    var refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (refreshing) return;
      refreshing = true;
      location.reload();
    });
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }

  syncMenu();
  newGame();
})();
</script>
</body>
</html>

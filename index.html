<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e6c896">
<title>Lights Out Stones</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20512%20512%27%3E%3Cdefs%3E%3CradialGradient%20id%3D%27s%27%20cx%3D%2735%25%27%20cy%3D%2730%25%27%20r%3D%2778%25%27%3E%3Cstop%20offset%3D%270%27%20stop-color%3D%27%235c5c62%27%2F%3E%3Cstop%20offset%3D%270.55%27%20stop-color%3D%27%232c2c30%27%2F%3E%3Cstop%20offset%3D%271%27%20stop-color%3D%27%23101013%27%2F%3E%3C%2FradialGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%27512%27%20height%3D%27512%27%20rx%3D%27100%27%20fill%3D%27%23e2bd7f%27%2F%3E%3Cpath%20d%3D%27M0%2090h512M0%20180h512M0%20270h512M0%20360h512M0%20450h512%27%20stroke%3D%27%23c89a5e%27%20stroke-width%3D%278%27%20opacity%3D%270.55%27%2F%3E%3Crect%20x%3D%2716%27%20y%3D%2716%27%20width%3D%27480%27%20height%3D%27480%27%20rx%3D%2788%27%20fill%3D%27none%27%20stroke%3D%27%23a07840%27%20stroke-width%3D%2710%27%2F%3E%3Ccircle%20cx%3D%27256%27%20cy%3D%27268%27%20r%3D%27150%27%20fill%3D%27url%28%23s%29%27%2F%3E%3Cellipse%20cx%3D%27204%27%20cy%3D%27206%27%20rx%3D%2746%27%20ry%3D%2732%27%20fill%3D%27%23ffffff%27%20opacity%3D%270.3%27%2F%3E%3C%2Fsvg%3E">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --wood-1: #eed9ae;
    --wood-2: #e2bd7f;
    --wood-3: #d9ad6c;
    --line: rgba(92, 58, 28, 0.75);
    --ink: #4a3626;
    --stone-black-1: #555;
    --stone-black-2: #1a1a1c;
    --stone-white-1: #ffffff;
    --stone-white-2: #d9d4c8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background:
      radial-gradient(ellipse at 20% 10%, #f7ecd2 0%, transparent 55%),
      linear-gradient(160deg, var(--wood-1) 0%, var(--wood-2) 55%, var(--wood-3) 100%);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 18px 14px 30px;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  h1 {
    font-size: clamp(22px, 5vw, 34px);
    letter-spacing: 0.12em;
    font-weight: normal;
    text-shadow: 0 1px 0 rgba(255,255,255,0.5);
  }
  .subtitle {
    font-style: italic;
    opacity: 0.65;
    font-size: clamp(12px, 3vw, 15px);
    margin-top: 2px;
    letter-spacing: 0.08em;
  }
  /* ---------- Панель управления ---------- */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin: 14px 0 8px;
    max-width: 560px;
  }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button {
    font-family: inherit; font-size: 14px; padding: 7px 12px;
    background: rgba(255, 251, 240, 0.55); color: var(--ink);
    border: none; cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.active { background: var(--ink); color: #f5e9d0; }
  .seg button:disabled { opacity: 0.35; cursor: default; }
  .btn {
    font-family: inherit; font-size: 14px; padding: 7px 14px;
    background: rgba(255, 251, 240, 0.75);
    color: var(--ink); border: 1px solid var(--line); border-radius: 8px;
    cursor: pointer; transition: background 0.15s, transform 0.1s;
  }
  .btn:hover { background: #fffaf0; }
  .btn:active { transform: scale(0.96); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.small { font-size: 12.5px; padding: 5px 10px; }
  /* ---------- Статистика партии ---------- */
  .stats {
    display: flex; gap: 18px; font-size: 15px; margin: 4px 0 12px;
    font-variant-numeric: tabular-nums;
  }
  .stats b { font-weight: normal; opacity: 0.65; font-size: 12px; display: block; text-align: center; letter-spacing: 0.1em; }
  .stats span { display: block; text-align: center; font-size: 18px; }
  /* ---------- Сцена: доска + аромапалочка ---------- */
  .scene { display: flex; align-items: center; gap: clamp(10px, 3vw, 26px); }
  .board-frame {
    padding: clamp(10px, 2.5vw, 18px);
    border-radius: 10px;
    background:
      repeating-linear-gradient(90deg, rgba(140,95,45,0.16) 0 2px, transparent 2px 26px),
      linear-gradient(145deg, #caa06a, #b3854e);
    box-shadow:
      0 10px 24px rgba(60, 35, 10, 0.35),
      inset 0 2px 3px rgba(255, 235, 200, 0.5),
      inset 0 -2px 4px rgba(80, 50, 20, 0.4);
  }
  .board {
    position: relative;
    display: grid;
    width: min(78vw, 420px);
    aspect-ratio: 1;
    border-radius: 4px;
    background:
      radial-gradient(circle at 30% 25%, rgba(255, 240, 205, 0.5), transparent 60%),
      linear-gradient(150deg, #eccf95, #ddb271 70%, #d3a45f);
    box-shadow: inset 0 0 0 1px rgba(92, 58, 28, 0.35), inset 0 2px 10px rgba(120, 80, 35, 0.25);
  }
  .cell {
    position: relative;
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 0;
    outline: none;
  }
  .cell:focus-visible .stone { box-shadow: 0 0 0 2px #7a5; }
  .stone {
    position: absolute;
    inset: 7%;
    border-radius: 50%;
    transition: transform 0.18s ease;
  }
  .cell:active .stone { transform: scale(0.9); }
  .face {
    position: absolute; inset: 0; border-radius: 50%;
    transition: opacity 0.28s ease;
    backface-visibility: hidden;
  }
  .face.white {
    background: radial-gradient(circle at 34% 28%, var(--stone-white-1) 0%, #efece4 45%, var(--stone-white-2) 100%);
    box-shadow: 0 2px 4px rgba(60, 35, 10, 0.45), inset 0 -2px 3px rgba(150, 140, 120, 0.5);
    opacity: 1;
  }
  .face.black {
    background: radial-gradient(circle at 34% 28%, var(--stone-black-1) 0%, #333 40%, var(--stone-black-2) 100%);
    box-shadow: 0 2px 4px rgba(60, 35, 10, 0.55), inset 0 -2px 3px rgba(0, 0, 0, 0.6);
    opacity: 0;
  }
  .cell.black .face.white { opacity: 0; }
  .cell.black .face.black { opacity: 1; }
  .cell.pressed .stone { animation: flipPulse 0.28s ease; }
  @keyframes flipPulse {
    0% { transform: scaleY(1); }
    45% { transform: scaleY(0.55); }
    100% { transform: scaleY(1); }
  }
  /* ---------- Аромапалочка ---------- */
  .incense-wrap {
    display: flex; flex-direction: column; align-items: center;
    align-self: stretch; justify-content: flex-end; padding-bottom: 8px;
  }
  .smoke { position: relative; width: 8px; height: 90px; margin-bottom: -6px; }
  .smoke i {
    position: absolute; left: 50%; bottom: 0;
    width: 7px; height: 7px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.75);
    filter: blur(3px);
    opacity: 0;
    animation: rise 4s infinite ease-in;
  }
  .smoke i:nth-child(2) { animation-delay: 1.3s; }
  .smoke i:nth-child(3) { animation-delay: 2.6s; }
  @keyframes rise {
    0%   { transform: translate(0, 0) scale(0.6); opacity: 0; }
    15%  { opacity: 0.8; }
    60%  { transform: translate(-7px, -46px) scale(1.5); opacity: 0.4; }
    100% { transform: translate(6px, -88px) scale(2.2); opacity: 0; }
  }
  .stick {
    width: 6px; height: 110px;
    border-radius: 3px 3px 0 0;
    background: linear-gradient(90deg, #6e3f1f, #a06a3a 45%, #5c3319);
    position: relative;
    overflow: hidden;
  }
  .stick::before {
    content: '';
    position: absolute; top: calc(var(--burn, 0) * 1.05px - 5px); left: 50%; transform: translateX(-50%);
    width: 7px; height: 7px; border-radius: 50%;
    background: radial-gradient(circle, #ffd98a 0%, #ff8c2e 55%, rgba(200, 60, 10, 0.9) 100%);
    animation: ember 2.2s infinite ease-in-out;
    transition: top 1s linear;
  }
  /* обгоревшая часть палочки растёт сверху вниз, полное тление — 5 минут */
  .stick::after {
    content: '';
    position: absolute; left: 0; top: 0; right: 0;
    height: calc(var(--burn, 0) * 1.05px);
    background: linear-gradient(180deg, #150e09, #2b1c12);
    border-radius: 3px 3px 0 0;
    transition: height 1s linear;
  }
  @keyframes ember {
    0%, 100% { box-shadow: 0 0 4px 1px rgba(255, 150, 50, 0.7); }
    50% { box-shadow: 0 0 9px 3px rgba(255, 120, 30, 0.95); }
  }
  .holder {
    width: 26px; height: 12px; border-radius: 0 0 8px 8px;
    background: linear-gradient(180deg, #8a5a30, #5f3c1c);
    box-shadow: 0 2px 3px rgba(60, 35, 10, 0.4);
  }
  /* ---------- Оверлеи ---------- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(50, 32, 14, 0.55);
    backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center;
    z-index: 10; padding: 20px;
  }
  .overlay.show { display: flex; }
  .card {
    background: linear-gradient(160deg, #fbf3df, #f0dfb8);
    border: 1px solid var(--line); border-radius: 14px;
    padding: 26px 30px; text-align: center;
    box-shadow: 0 18px 50px rgba(40, 22, 5, 0.5);
    max-width: 420px; width: 100%;
    max-height: 85vh; overflow-y: auto;
  }
  .card h2 { font-weight: normal; letter-spacing: 0.15em; margin-bottom: 6px; }
  .card .zen { font-style: italic; opacity: 0.65; margin-bottom: 14px; font-size: 14px; }
  .card .big { font-size: 20px; margin: 10px 0; }
  .card .record { color: #9a5b12; font-size: 15px; margin-bottom: 10px; min-height: 20px; }
  .card .row { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
  table.wins { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-top: 8px; }
  table.wins th, table.wins td { padding: 5px 6px; border-bottom: 1px solid rgba(92,58,28,0.25); }
  table.wins th { opacity: 0.6; font-weight: normal; letter-spacing: 0.06em; font-size: 11.5px; }
  .empty { font-style: italic; opacity: 0.55; margin: 12px 0; }
  .menu-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin: 10px 0;
  }
  .menu-label { font-size: 14px; letter-spacing: 0.08em; opacity: 0.75; }
  .menu-note {
    font-size: 12.5px; font-style: italic; opacity: 0.6;
    margin: 12px 0 2px; line-height: 1.45;
  }
  /* ---------- Ползунок громкости ---------- */
  input.vol {
    -webkit-appearance: none; appearance: none;
    width: 160px; max-width: 60vw; height: 6px;
    border-radius: 3px; outline: none;
    background: linear-gradient(90deg, var(--ink) var(--fill, 80%), rgba(92, 58, 28, 0.25) var(--fill, 80%));
    cursor: pointer;
  }
  input.vol::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 18px; height: 18px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff8ea, #e2bd7f);
    border: 1px solid var(--line);
    box-shadow: 0 1px 3px rgba(60, 35, 10, 0.4);
  }
  input.vol::-moz-range-thumb {
    width: 18px; height: 18px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff8ea, #e2bd7f);
    border: 1px solid var(--line);
    box-shadow: 0 1px 3px rgba(60, 35, 10, 0.4);
  }
  /* ---------- Статистика: разделы сложности ---------- */
  .diff-title {
    text-align: left; font-size: 13px; letter-spacing: 0.12em;
    opacity: 0.7; margin: 14px 0 2px;
  }
  .diff-title:first-child { margin-top: 4px; }
  /* ---------- Узкий экран: в меню подпись строкой выше, кнопки тянутся ---------- */
  @media (max-width: 480px) {
    .menu-row { flex-direction: column; align-items: stretch; gap: 6px; margin: 12px 0; }
    .menu-label { text-align: left; }
    .seg button { flex: 1; padding: 8px 6px; font-size: 13.5px; }
    table.wins { font-size: 12px; }
    table.wins th, table.wins td { padding: 4px 3px; }
  }
  /* ---------- Горизонтальная ориентация: ужимаем, чтобы всё поле влезло без скролла ---------- */
  @media (orientation: landscape) and (max-height: 560px) {
    body { padding: 8px 10px 12px; }
    h1 { font-size: 19px; }
    .subtitle { display: none; }
    .controls { margin: 6px 0 4px; gap: 6px; }
    .stats { margin: 2px 0 6px; font-size: 13px; }
    .stats span { font-size: 15px; }
    .board { width: min(50vw, 58vh, 420px); }
    .board-frame { padding: 8px; }
    .incense-wrap { display: none; }
  }
</style>
</head>
<body>

<h1>Lights Out Stones</h1>
<div class="subtitle" id="subtitle">◈ восточная головоломка · переверните все камни в белые</div>

<div class="controls">
  <div class="seg" id="levelSeg">
    <button data-n="3">3×3</button>
    <button data-n="5" class="active">5×5</button>
    <button data-n="7">7×7</button>
  </div>
  <button class="btn small" id="undoBtn">↩ Отменить ход</button>
  <button class="btn small" id="newBtn">Новая игра</button>
  <button class="btn small" id="pauseBtn">⏸ Пауза</button>
  <button class="btn small" id="menuBtn">☰ Меню</button>
</div>

<div class="stats">
  <div><b>ХОДЫ</b><span id="moves">0</span></div>
  <div><b>ВРЕМЯ</b><span id="time">0:00</span></div>
  <div><b>РЕКОРД</b><span id="best">—</span></div>
</div>

<div class="scene">
  <div class="board-frame">
    <div class="board" id="board"></div>
  </div>
  <div class="incense-wrap" aria-hidden="true">
    <div class="smoke"><i></i><i></i><i></i></div>
    <div class="stick" id="incenseStick"></div>
    <div class="holder"></div>
  </div>
</div>

<!-- Победа -->
<div class="overlay" id="winOverlay">
  <div class="card">
    <h2>ПОБЕДА</h2>
    <div class="zen" id="winZen">все камни обратились свету</div>
    <div class="big" id="winDetails"></div>
    <div class="record" id="winRecord"></div>
    <div class="row">
      <button class="btn" id="againBtn">Играть снова</button>
      <button class="btn" id="nextBtn">Следующий уровень</button>
    </div>
  </div>
</div>

<!-- Статистика -->
<div class="overlay" id="statsOverlay">
  <div class="card">
    <h2>СТАТИСТИКА</h2>
    <div class="zen">список побед</div>
    <div id="winsBody"></div>
    <div class="row">
      <button class="btn small" id="resetStatsBtn">Сбросить рекорды</button>
      <button class="btn" id="closeStatsBtn">Закрыть</button>
    </div>
  </div>
</div>

<!-- Пауза -->
<div class="overlay" id="pauseOverlay">
  <div class="card">
    <h2>ПАУЗА</h2>
    <div class="zen">пусть доска подождёт — мысль догонит</div>
    <div class="row">
      <button class="btn" id="resumeBtn">Продолжить</button>
      <button class="btn" id="pauseMenuBtn">Меню</button>
    </div>
  </div>
</div>

<!-- Меню -->
<div class="overlay" id="menuOverlay">
  <div class="card">
    <h2>МЕНЮ</h2>
    <div class="zen">настройки игры</div>
    <div class="menu-row">
      <div class="menu-label">Режим</div>
      <div class="seg" id="modeSeg">
        <button data-mode="rays" class="active">Лучи</button>
        <button data-mode="cross">Крест</button>
      </div>
    </div>
    <div class="menu-row">
      <div class="menu-label">Сложность</div>
      <div class="seg" id="diffSeg">
        <button data-diff="easy">Легко</button>
        <button data-diff="medium" class="active">Средне</button>
        <button data-diff="hard">Тяжело</button>
      </div>
    </div>
    <div class="menu-row">
      <div class="menu-label">Цель</div>
      <div class="seg" id="targetSeg">
        <button data-target="white" class="active">⚪ Белые</button>
        <button data-target="black">⚫ Чёрные</button>
      </div>
    </div>
    <div class="menu-row">
      <div class="menu-label">Звук</div>
      <div class="seg" id="soundSeg">
        <button data-sound="on" class="active">Вкл</button>
        <button data-sound="off">Выкл</button>
      </div>
    </div>
    <div class="menu-row">
      <div class="menu-label">Музыка</div>
      <div class="seg" id="musicSeg">
        <button data-music="on">Вкл</button>
        <button data-music="off" class="active">Выкл</button>
      </div>
    </div>
    <div class="menu-row">
      <div class="menu-label">Мелодия</div>
      <div class="seg" id="melodySeg">
        <button data-melody="zen" class="active">Дзен</button>
        <button data-melody="pirates">Пираты</button>
      </div>
    </div>
    <div class="menu-row">
      <div class="menu-label">Громкость музыки</div>
      <input type="range" id="volumeRange" class="vol" min="0" max="100" step="1" aria-label="Громкость музыки">
    </div>
    <div class="menu-note" id="modeNote"></div>
    <div class="row">
      <button class="btn small" id="menuStatsBtn">Статистика</button>
      <button class="btn small" id="menuNewBtn">Новая игра</button>
      <button class="btn" id="closeMenuBtn">Закрыть</button>
    </div>
  </div>
</div>

<script src="game.js"></script>
<script>
(function () {
  'use strict';
  var L = window.LightsOutLogic;

  // Диапазоны числа случайных нажатий при генерации: режим → сложность → размер.
  // Меньше нажатий — проще партия; «лучи» перемешивают сильнее, поэтому там меньше.
  var PRESSES = {
    cross: {
      easy:   { 3: [2, 3],  5: [4, 6],  7: [6, 9] },
      medium: { 3: [4, 6],  5: [8, 12], 7: [12, 16] },
      hard:   { 3: [7, 9],  5: [14, 18], 7: [18, 24] }
    },
    rays: {
      easy:   { 3: [1, 2], 5: [2, 3], 7: [3, 4] },
      medium: { 3: [2, 3], 5: [3, 5], 7: [4, 6] },
      hard:   { 3: [4, 5], 5: [6, 8], 7: [7, 10] }
    }
  };
  var LEVELS = [3, 5, 7];
  var DIFFS = ['easy', 'medium', 'hard'];
  var MODE_NOTES = {
    rays: 'Лучи: нажатие переворачивает все камни своей строки и своего столбца.',
    cross: 'Крест: нажатие переворачивает камень и его ближайших соседей по вертикали и горизонтали.'
  };

  var state = {
    n: 5,
    mode: localStorage.getItem('los_mode') === 'cross' ? 'cross' : 'rays',
    diff: DIFFS.indexOf(localStorage.getItem('los_diff')) >= 0 ? localStorage.getItem('los_diff') : 'medium',
    target: localStorage.getItem('los_target') === 'black' ? 'black' : 'white',
    sound: localStorage.getItem('los_sound') !== 'off',
    music: localStorage.getItem('los_music') === 'on',
    melody: localStorage.getItem('los_melody') === 'pirates' ? 'pirates' : 'zen',
    volume: Math.min(1, Math.max(0, Number(localStorage.getItem('los_volume')) || 0.8)),
    unlocked: Math.max(3, Number(localStorage.getItem('los_unlocked')) || 3),
    board: [],
    moves: 0,
    history: [],
    timerId: null,
    startedAt: null,
    elapsed: 0,
    locked: false,
    paused: false
  };

  function targetColor() { return state.target === 'black' ? L.BLACK : L.WHITE; }

  // если выбранный размер ещё не открыт — начинаем с максимально доступного
  if (state.n > state.unlocked) state.n = state.unlocked;

  var els = {
    board: document.getElementById('board'),
    moves: document.getElementById('moves'),
    time: document.getElementById('time'),
    best: document.getElementById('best'),
    undo: document.getElementById('undoBtn'),
    win: document.getElementById('winOverlay'),
    winDetails: document.getElementById('winDetails'),
    winRecord: document.getElementById('winRecord'),
    stats: document.getElementById('statsOverlay'),
    winsBody: document.getElementById('winsBody'),
    pause: document.getElementById('pauseOverlay'),
    menu: document.getElementById('menuOverlay'),
    modeNote: document.getElementById('modeNote'),
    subtitle: document.getElementById('subtitle'),
    winZen: document.getElementById('winZen')
  };

  /* ---------- Хранилище рекордов ---------- */
  // Рекорд зависит от всех параметров партии, иначе «легко» бьёт рекорд «тяжело»
  function bestKey(n) {
    return 'los_best_' + n + '_' + state.mode + '_' + state.diff + '_' + state.target;
  }
  function getBest(n) {
    var v = localStorage.getItem(bestKey(n));
    return v === null ? null : Number(v);
  }
  function getWins() {
    try { return JSON.parse(localStorage.getItem('los_wins') || '[]'); }
    catch (e) { return []; }
  }
  function addWin(entry) {
    var wins = getWins();
    wins.unshift(entry);
    localStorage.setItem('los_wins', JSON.stringify(wins.slice(0, 200)));
  }

  /* ---------- Звук (Web Audio, без файлов) ---------- */
  var actx = null;
  function audio() {
    if (!actx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) actx = new AC();
    }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  function sndClick() {
    if (!state.sound) return;
    var ctx = audio(); if (!ctx) return;
    var t = ctx.currentTime;
    // деревянный щелчок: короткий шумовой импульс + низкий тон
    var len = Math.floor(ctx.sampleRate * 0.06);
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var noise = ctx.createBufferSource(); noise.buffer = buf;
    var nf = ctx.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 900; nf.Q.value = 2;
    var ng = ctx.createGain();
    ng.gain.setValueAtTime(0.5, t);
    ng.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
    noise.connect(nf); nf.connect(ng); ng.connect(ctx.destination);
    noise.start(t);
    var osc = ctx.createOscillator(); osc.type = 'sine'; osc.frequency.value = 160;
    var og = ctx.createGain();
    og.gain.setValueAtTime(0.25, t);
    og.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    osc.connect(og); og.connect(ctx.destination);
    osc.start(t); osc.stop(t + 0.13);
  }
  // один мягкий «переворот» камня (без ударного акцента)
  function sndFlipTick(vol, when) {
    var ctx = actx; if (!ctx) return;
    var len = Math.floor(ctx.sampleRate * 0.05);
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var src = ctx.createBufferSource(); src.buffer = buf;
    var f = ctx.createBiquadFilter(); f.type = 'bandpass';
    f.frequency.value = 1200 + Math.random() * 600; f.Q.value = 3;
    var g = ctx.createGain();
    g.gain.setValueAtTime(vol, when);
    g.gain.exponentialRampToValueAtTime(0.001, when + 0.07);
    src.connect(f); f.connect(g); g.connect(ctx.destination);
    src.start(when);
    var o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.value = 190 + Math.random() * 60;
    var og = ctx.createGain();
    og.gain.setValueAtTime(vol * 0.5, when);
    og.gain.exponentialRampToValueAtTime(0.001, when + 0.09);
    o.connect(og); og.connect(ctx.destination);
    o.start(when); o.stop(when + 0.1);
  }
  // один мягкий «переворот» нажатого камня
  function sndFlip() {
    if (!state.sound) return;
    var ctx = audio(); if (!ctx) return;
    sndFlipTick(0.45, ctx.currentTime + 0.01);
  }
  function sndWin() {
    if (!state.sound) return;
    var ctx = audio(); if (!ctx) return;
    // пентатоническое арпеджио — восточный оттенок
    var notes = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];
    notes.forEach(function (f, i) {
      var t = ctx.currentTime + i * 0.16;
      var osc = ctx.createOscillator(); osc.type = 'triangle'; osc.frequency.value = f;
      var g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(t); osc.stop(t + 0.65);
    });
  }

  /* ---------- Музыка: генеративная «живая» тема (без файлов) ----------
   * Живые пентатонические переборы (кото) + флейтовые фразы с вибрато
   * + редкие переливы «птиц». Всё синтезируется на лету: бесконечно и не повторяется.
   */
  var music = { on: false, timerId: null, pad: [], bus: null,
                stepAt: 0, step: 0, arpIdx: 4, fluteAt: 0, birdAt: 0,
                nextTime: 0, pi8: 0, loopStart: 0 };
  var MUSIC_SCALE = [261.63, 293.66, 329.63, 392.0, 440.0,    // C4-пентатоника
                     523.25, 587.33, 659.25, 784.0, 880.0];   // вторая октава

  function musicBusEnsure() {
    if (!music.bus) {
      music.bus = actx.createGain();
      music.bus.gain.value = state.volume;
      music.bus.connect(actx.destination);
    }
  }
  function pluckNote(freq, when, vol) {
    var osc = actx.createOscillator(); osc.type = 'triangle'; osc.frequency.value = freq;
    var flt = actx.createBiquadFilter(); flt.type = 'lowpass';
    flt.frequency.setValueAtTime(freq * 6, when);
    flt.frequency.exponentialRampToValueAtTime(freq * 1.5, when + 0.9);
    var g = actx.createGain();
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(vol, when + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 1.5);
    osc.connect(flt); flt.connect(g); g.connect(music.bus);
    osc.start(when); osc.stop(when + 1.7);
  }
  function fluteNote(freq, when, dur, vol) {
    var osc = actx.createOscillator(); osc.type = 'sine'; osc.frequency.value = freq;
    // вибрато, как у духовых
    var vib = actx.createOscillator(); vib.type = 'sine'; vib.frequency.value = 5 + Math.random() * 1.5;
    var vg = actx.createGain(); vg.gain.value = freq * 0.008;
    vib.connect(vg); vg.connect(osc.frequency);
    var g = actx.createGain();
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(vol, when + 0.12);
    g.gain.setValueAtTime(vol, when + Math.max(0.13, dur - 0.3));
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    osc.connect(g); g.connect(music.bus);
    osc.start(when); osc.stop(when + dur + 0.05);
    vib.start(when); vib.stop(when + dur + 0.05);
  }
  function birdChirp(when) {
    [0, 0.13].forEach(function (ofs, i) {
      var osc = actx.createOscillator(); osc.type = 'sine';
      var f0 = 2300 + Math.random() * 700 + i * 250;
      osc.frequency.setValueAtTime(f0, when + ofs);
      osc.frequency.exponentialRampToValueAtTime(f0 * 1.5, when + ofs + 0.07);
      osc.frequency.exponentialRampToValueAtTime(f0 * 1.1, when + ofs + 0.11);
      var g = actx.createGain();
      g.gain.setValueAtTime(0.0001, when + ofs);
      g.gain.exponentialRampToValueAtTime(0.026, when + ofs + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, when + ofs + 0.13);
      osc.connect(g); g.connect(music.bus);
      osc.start(when + ofs); osc.stop(when + ofs + 0.15);
    });
  }
  /* ---------- «Пираты тёмной воды»: тема в духе 16-бит ----------
   * Не копия саундтрека Sega (мелодия защищена авторским правом), а свободная
   * аранжировка «в духе»: горн-призыв в D-миноре, штабельный ритм, квадратный лид.
   */
  var PIRATES_E8 = 60 / 78 / 2;  // восьмая при 78 BPM — неторопливо, «на подумать»
  var PIRATES_LOOP = 64;          // восьмых в цикле (8 тактов)
  // [midi-нота, длина в восьмых]; 0 — пауза
  var PIRATES_LEAD = [
    [69,1],[74,1],[77,1],[76,1],[74,2],[69,1],[71,1],
    [74,3],[72,1],[69,2],[65,1],[67,1],
    [70,2],[74,1],[72,1],[70,2],[67,1],[70,1],
    [69,6],[0,2],
    [77,2],[81,1],[79,1],[77,2],[74,1],[77,1],
    [76,2],[79,1],[76,1],[72,2],[76,1],[72,1],
    [74,1],[76,1],[77,1],[79,1],[81,2],[77,2],
    [74,5],[69,1],[0,2]
  ];
  var PIRATES_BASS = [
    [50,2],[50,2],[45,2],[45,2],
    [50,2],[50,2],[45,2],[45,2],
    [46,2],[46,2],[43,2],[43,2],
    [45,2],[45,2],[45,2],[45,2],
    [50,2],[50,2],[45,2],[45,2],
    [48,2],[48,2],[43,2],[43,2],
    [50,2],[50,2],[45,2],[45,2],
    [50,2],[45,2],[50,2],[45,2]
  ];
  var piratesEv = null;
  function piratesBuild() {
    if (piratesEv) return piratesEv;
    var lead = [], bass = [], t = 0;
    PIRATES_LEAD.forEach(function (e) { if (e[0]) lead.push({ t: t, midi: e[0], dur: e[1] }); t += e[1]; });
    t = 0;
    PIRATES_BASS.forEach(function (e) { if (e[0]) bass.push({ t: t, midi: e[0], dur: e[1] }); t += e[1]; });
    piratesEv = { lead: lead, bass: bass };
    return piratesEv;
  }
  function piratesLead(midi, when, durE8) {
    var f = 440 * Math.pow(2, (midi - 69) / 12);
    var o1 = actx.createOscillator(); o1.type = 'square'; o1.frequency.value = f;
    var o2 = actx.createOscillator(); o2.type = 'square'; o2.frequency.value = f; o2.detune.value = 9;
    var flt = actx.createBiquadFilter(); flt.type = 'lowpass'; flt.frequency.value = 2400;
    var g = actx.createGain();
    var dur = durE8 * PIRATES_E8;
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(0.055, when + 0.015);
    g.gain.setValueAtTime(0.055, when + Math.max(0.02, dur - 0.06));
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    o1.connect(flt); o2.connect(flt); flt.connect(g); g.connect(music.bus);
    o1.start(when); o1.stop(when + dur + 0.02);
    o2.start(when); o2.stop(when + dur + 0.02);
  }
  function piratesBass(midi, when, durE8) {
    var f = 440 * Math.pow(2, (midi - 69) / 12);
    var osc = actx.createOscillator(); osc.type = 'triangle'; osc.frequency.value = f;
    var g = actx.createGain();
    var dur = durE8 * PIRATES_E8;
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(0.07, when + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    osc.connect(g); g.connect(music.bus);
    osc.start(when); osc.stop(when + dur + 0.02);
  }
  function piratesHat(when) {
    var len = Math.floor(actx.sampleRate * 0.03);
    var buf = actx.createBuffer(1, len, actx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var src = actx.createBufferSource(); src.buffer = buf;
    var f = actx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 6500;
    var g = actx.createGain();
    g.gain.setValueAtTime(0.018, when);
    g.gain.exponentialRampToValueAtTime(0.001, when + 0.03);
    src.connect(f); f.connect(g); g.connect(music.bus);
    src.start(when);
  }
  function piratesSchedule() {
    var ev = piratesBuild();
    var loopDur = PIRATES_LOOP * PIRATES_E8;
    while (music.nextTime < actx.currentTime + 1.2) {
      var cycle = Math.floor(music.pi8 / PIRATES_LOOP);
      var pos = music.pi8 % PIRATES_LOOP;
      var when = music.loopStart + cycle * loopDur + pos * PIRATES_E8;
      for (var i = 0; i < ev.lead.length; i++) if (ev.lead[i].t === pos) piratesLead(ev.lead[i].midi, when, ev.lead[i].dur);
      for (var j = 0; j < ev.bass.length; j++) if (ev.bass[j].t === pos) piratesBass(ev.bass[j].midi, when, ev.bass[j].dur);
      if (pos % 2 === 0) piratesHat(when);
      music.pi8++;
      music.nextTime = music.loopStart + Math.floor(music.pi8 / PIRATES_LOOP) * loopDur + (music.pi8 % PIRATES_LOOP) * PIRATES_E8;
    }
  }
  function musicSchedule() {
    // планируем на ~1,2 с вперёд, чтобы звук шёл ровно, без задержек кадра
    // переборы: шаг ~0,5 с, неторопливое блуждание по пентатонике
    while (music.stepAt < actx.currentTime + 1.2) {
      music.step++;
      music.arpIdx += Math.floor(Math.random() * 5) - 2;      // -2..+2
      music.arpIdx = Math.max(0, Math.min(MUSIC_SCALE.length - 1, music.arpIdx));
      var v = 0.055 + Math.random() * 0.045;
      if (music.step % 8 === 0) v *= 1.35;                    // первый звук «такта» чуть сильнее
      pluckNote(MUSIC_SCALE[music.arpIdx], music.stepAt, v);
      music.stepAt += 0.72 + Math.random() * 0.2;
    }
    // флейта: фраза из 3–5 нот каждые 6–10 с
    if (music.fluteAt < actx.currentTime + 1.2) {
      var nNotes = 3 + Math.floor(Math.random() * 3);
      var fi = Math.floor(Math.random() * (MUSIC_SCALE.length - 4));
      for (var k = 0; k < nNotes; k++) {
        fi += Math.floor(Math.random() * 3) - 1;
        fi = Math.max(0, Math.min(MUSIC_SCALE.length - 1, fi));
        fluteNote(MUSIC_SCALE[fi] * 2, music.fluteAt + k * 0.42,
                  0.5 + Math.random() * 0.5, 0.032 + Math.random() * 0.02);
      }
      music.fluteAt += 6 + Math.random() * 4;
    }
    // «птицы»: редкие переливы поверх
    if (music.birdAt < actx.currentTime + 1.2) {
      birdChirp(music.birdAt + Math.random() * 0.5);
      music.birdAt += 8 + Math.random() * 7;
    }
  }
  function musicPadStart() {
    // фоновый гул: C3 + G3, с лёгким расстроенным обертоном
    [[130.81, 0.030], [196.0, 0.022]].forEach(function (cfg) {
      var o1 = actx.createOscillator(); o1.type = 'sine'; o1.frequency.value = cfg[0];
      var o2 = actx.createOscillator(); o2.type = 'sine'; o2.frequency.value = cfg[0] * 2.005;
      var g2 = actx.createGain(); g2.gain.value = 0.4;
      var g = actx.createGain(); g.gain.value = 0;
      g.gain.setTargetAtTime(cfg[1], actx.currentTime, 4);
      o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(music.bus);
      o1.start(); o2.start();
      music.pad.push({ o1: o1, o2: o2, g: g, level: cfg[1] });
    });
  }
  function musicStart() {
    var ctx = audio(); if (!ctx) return;
    musicBusEnsure();
    music.on = true;
    if (!music.pad.length) musicPadStart();
    else music.pad.forEach(function (p) { p.g.gain.setTargetAtTime(p.level, ctx.currentTime, 1.5); });
    if (music.timerId) { clearInterval(music.timerId); music.timerId = null; }
    if (state.melody === 'pirates') {
      music.loopStart = ctx.currentTime + 0.15;
      music.pi8 = 0;
      music.nextTime = music.loopStart;
      music.timerId = setInterval(piratesSchedule, 300);
    } else {
      music.stepAt = ctx.currentTime + 0.2;
      music.step = 0;
      music.arpIdx = 4;
      music.fluteAt = ctx.currentTime + 3.5;
      music.birdAt = ctx.currentTime + 6.5;
      music.timerId = setInterval(musicSchedule, 400);
    }
  }
  function musicStop() {
    music.on = false;
    if (music.timerId) { clearInterval(music.timerId); music.timerId = null; }
    if (actx) music.pad.forEach(function (p) { p.g.gain.setTargetAtTime(0, actx.currentTime, 0.6); });
  }

  /* ---------- Уровни: открываются по очереди, 3×3 → 5×5 → 7×7 ---------- */
  function renderLevels() {
    document.querySelectorAll('#levelSeg button').forEach(function (b) {
      var locked = Number(b.dataset.n) > state.unlocked;
      b.disabled = locked;
      b.textContent = locked ? '🔒' : (b.dataset.n + '×' + b.dataset.n);
      b.classList.toggle('active', Number(b.dataset.n) === state.n);
    });
  }

  /* ---------- Аромапалочка: тление за 5 минут партийного времени ---------- */
  var stickEl = document.getElementById('incenseStick');
  function updateIncense() {
    if (!stickEl) return;
    var pct = Math.min(100, state.elapsed / 300 * 100);
    stickEl.style.setProperty('--burn', pct.toFixed(2));
  }

  /* ---------- Таймер ---------- */
  function fmtTime(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  function startTimer() {
    if (state.timerId) return;
    // startedAt в прошлом на величину уже накопленного времени — таймер корректно продолжается после паузы
    state.startedAt = Date.now() - state.elapsed * 1000;
    state.timerId = setInterval(function () {
      state.elapsed = Math.floor((Date.now() - state.startedAt) / 1000);
      els.time.textContent = fmtTime(state.elapsed);
      updateIncense();
    }, 500);
  }
  function stopTimer() {
    if (state.timerId) { clearInterval(state.timerId); state.timerId = null; }
    if (state.startedAt) {
      state.elapsed = Math.floor((Date.now() - state.startedAt) / 1000);
      state.startedAt = null;
    }
  }

  /* ---------- Отрисовка ---------- */
  function paintGrid() {
    var n = state.n;
    var lines = [];
    for (var i = 0; i < n; i++) {
      var p = ((i + 0.5) / n * 100).toFixed(3) + '%';
      lines.push('linear-gradient(to right, transparent ' + p + ', var(--line) ' + p + ', var(--line) calc(' + p + ' + 1.6px), transparent calc(' + p + ' + 1.6px))');
      lines.push('linear-gradient(to bottom, transparent ' + p + ', var(--line) ' + p + ', var(--line) calc(' + p + ' + 1.6px), transparent calc(' + p + ' + 1.6px))');
    }
    // хоси (звёздные точки), как на досках для го
    var stars = { 3: [1], 5: [2], 7: [3] }[n] || [];
    stars.forEach(function (r) {
      stars.forEach(function (c) {
        var x = ((c + 0.5) / n * 100).toFixed(3) + '%';
        var y = ((r + 0.5) / n * 100).toFixed(3) + '%';
        lines.push('radial-gradient(circle at ' + x + ' ' + y + ', var(--line) 0 3px, transparent 3.5px)');
      });
    });
    els.board.style.backgroundImage = lines.join(', ');
  }

  function render(pressedIdx) {
    var n = state.n;
    els.board.style.gridTemplateColumns = 'repeat(' + n + ', 1fr)';
    els.board.innerHTML = '';
    for (var r = 0; r < n; r++) {
      for (var c = 0; c < n; c++) {
        (function (r, c) {
          var idx = r * n + c;
          var cell = document.createElement('button');
          cell.className = 'cell' + (state.board[idx] === L.BLACK ? ' black' : '');
          cell.setAttribute('aria-label', 'камень ' + (r + 1) + '-' + (c + 1));
          if (idx === pressedIdx) {
            cell.classList.add('pressed');
            setTimeout(function () { cell.classList.remove('pressed'); }, 300);
          }
          var stone = document.createElement('span');
          stone.className = 'stone';
          stone.innerHTML = '<span class="face white"></span><span class="face black"></span>';
          cell.appendChild(stone);
          cell.addEventListener('click', function () { onPress(r, c); });
          els.board.appendChild(cell);
        })(r, c);
      }
    }
    els.moves.textContent = state.moves;
    els.undo.disabled = state.history.length === 0;
  }

  function renderBest() {
    var b = getBest(state.n);
    els.best.textContent = b === null ? '—' : fmtTime(b);
  }

  /* ---------- Логика партии ---------- */
  function newGame() {
    stopTimer();
    var n = state.n;
    var color = targetColor();
    var range = PRESSES[state.mode][state.diff][n];
    // защита от случайно «пустой» генерации (нажатия сократились до нуля):
    // перегенерируем, пока стартовая позиция не станет нерешённой
    var board, num, tries = 0;
    do {
      num = range[0] + Math.floor(Math.random() * (range[1] - range[0] + 1));
      board = L.generateBoard(n, num, Math.random, state.mode, color);
      tries++;
    } while (L.isWin(board, color) && tries < 20);
    state.board = board;
    state.moves = 0;
    state.history = [];
    state.elapsed = 0;
    state.locked = false;
    state.paused = false;
    pauseBtn.textContent = '⏸ Пауза';
    els.time.textContent = '0:00';
    updateIncense();
    els.win.classList.remove('show');
    els.pause.classList.remove('show');
    els.subtitle.textContent = state.target === 'black'
      ? '◈ восточная головоломка · переверните все камни в чёрные'
      : '◈ восточная головоломка · переверните все камни в белые';
    paintGrid();
    render();
    renderBest();
  }

  function onPress(r, c) {
    if (state.locked || state.paused) return;
    if (state.moves === 0 && !state.startedAt) startTimer();
    state.history.push(state.board.slice());
    state.board = L.applyPress(state.board, state.n, r, c, state.mode);
    state.moves++;
    sndFlip();
    render(r * state.n + c);
    if (L.isWin(state.board, targetColor())) onWin();
  }

  function onUndo() {
    if (state.locked || state.history.length === 0) return;
    state.board = state.history.pop();
    state.moves = Math.max(0, state.moves - 1);
    sndClick();
    render();
  }

  function onWin() {
    state.locked = true;
    stopTimer();
    sndWin();
    var n = state.n;
    var prev = getBest(n);
    var isRecord = prev === null || state.elapsed < prev;
    if (isRecord) localStorage.setItem(bestKey(n), String(state.elapsed));
    addWin({ date: new Date().toISOString().slice(0, 10), level: n, mode: state.mode, diff: state.diff, target: state.target, time: state.elapsed, moves: state.moves });
    // прошли уровень — открываем следующий
    var nextLevel = LEVELS[LEVELS.indexOf(n) + 1];
    if (nextLevel && nextLevel > state.unlocked) {
      state.unlocked = nextLevel;
      localStorage.setItem('los_unlocked', String(nextLevel));
      renderLevels();
    }
    els.winZen.textContent = state.target === 'black'
      ? 'все камни обратились тени'
      : 'все камни обратились свету';
    els.winDetails.textContent = 'Уровень ' + n + '×' + n + ' · ' +
      fmtTime(state.elapsed) + ' · ' + state.moves + ' ходов';
    els.winRecord.textContent = isRecord ? '✦ Новый рекорд! ✦' : 'Рекорд: ' + fmtTime(prev);
    renderBest();
    setTimeout(function () { els.win.classList.add('show'); }, 450);
  }

  /* ---------- Статистика ---------- */
  var DIFF_LABELS = { easy: 'Легко', medium: 'Средне', hard: 'Тяжело' };

  function winsTable(rows) {
    var body = rows.map(function (w) {
      var mode = w.mode === 'cross' ? 'крест' : (w.mode === 'rays' ? 'лучи' : '—');
      return '<tr><td>' + w.date + '</td><td>' + w.level + '×' + w.level + '</td><td>' +
        mode + '</td><td>' + fmtTime(w.time) + '</td><td>' + w.moves + '</td></tr>';
    }).join('');
    return '<table class="wins"><tr><th>ДАТА</th><th>УРОВЕНЬ</th><th>РЕЖИМ</th><th>ВРЕМЯ</th><th>ХОДЫ</th></tr>' +
      body + '</table>';
  }

  function renderStats() {
    var wins = getWins();
    if (wins.length === 0) {
      els.winsBody.innerHTML = '<div class="empty">Пока нет побед — доска ждёт.</div>';
      return;
    }
    // разбиваем по сложности; записи до появления сложности попадают в «Средне»
    var groups = { easy: [], medium: [], hard: [] };
    wins.forEach(function (w) {
      (groups[w.diff] ? groups[w.diff] : groups.medium).push(w);
    });
    var html = '';
    ['easy', 'medium', 'hard'].forEach(function (d) {
      if (!groups[d].length) return;
      html += '<div class="diff-title">' + DIFF_LABELS[d] + '</div>' + winsTable(groups[d]);
    });
    els.winsBody.innerHTML = html;
  }

  /* ---------- Пауза ---------- */
  var pauseBtn = document.getElementById('pauseBtn');
  function pauseGame() {
    if (state.paused || state.locked) return;
    state.paused = true;
    stopTimer();
    pauseBtn.textContent = '▶ Продолжить';
    els.pause.classList.add('show');
  }
  function resumeGame() {
    if (!state.paused) return;
    state.paused = false;
    pauseBtn.textContent = '⏸ Пауза';
    els.pause.classList.remove('show');
    if (state.moves > 0) startTimer(); // таймер продолжает с накопленного времени
  }

  /* ---------- Меню ---------- */
  function syncMenu() {
    document.querySelectorAll('#modeSeg button').forEach(function (b) {
      b.classList.toggle('active', b.dataset.mode === state.mode);
    });
    document.querySelectorAll('#diffSeg button').forEach(function (b) {
      b.classList.toggle('active', b.dataset.diff === state.diff);
    });
    document.querySelectorAll('#targetSeg button').forEach(function (b) {
      b.classList.toggle('active', b.dataset.target === state.target);
    });
    document.querySelectorAll('#soundSeg button').forEach(function (b) {
      b.classList.toggle('active', (b.dataset.sound === 'on') === state.sound);
    });
    document.querySelectorAll('#musicSeg button').forEach(function (b) {
      b.classList.toggle('active', (b.dataset.music === 'on') === state.music);
    });
    document.querySelectorAll('#melodySeg button').forEach(function (b) {
      b.classList.toggle('active', b.dataset.melody === state.melody);
    });
    els.modeNote.textContent = MODE_NOTES[state.mode];
  }

  /* ---------- События ---------- */
  document.getElementById('levelSeg').addEventListener('click', function (e) {
    var btn = e.target.closest('button'); if (!btn) return;
    if (btn.disabled) return;
    state.n = Number(btn.dataset.n);
    var seg = document.getElementById('levelSeg');
    seg.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b === btn); });
    newGame();
  });
  els.undo.addEventListener('click', onUndo);
  document.getElementById('newBtn').addEventListener('click', newGame);
  document.getElementById('againBtn').addEventListener('click', newGame);
  document.getElementById('nextBtn').addEventListener('click', function () {
    var i = LEVELS.indexOf(state.n);
    state.n = LEVELS[(i + 1) % LEVELS.length];
    document.getElementById('levelSeg').querySelectorAll('button').forEach(function (b) {
      b.classList.toggle('active', Number(b.dataset.n) === state.n);
    });
    renderLevels();
    newGame();
  });
  /* Пауза */
  document.getElementById('pauseBtn').addEventListener('click', function () {
    if (state.paused) { resumeGame(); } else { pauseGame(); }
  });
  document.getElementById('resumeBtn').addEventListener('click', resumeGame);
  document.getElementById('pauseMenuBtn').addEventListener('click', function () {
    els.pause.classList.remove('show');
    syncMenu();
    els.menu.classList.add('show');
  });
  /* Меню */
  document.getElementById('menuBtn').addEventListener('click', function () {
    syncMenu();
    els.menu.classList.add('show');
  });
  document.getElementById('closeMenuBtn').addEventListener('click', function () {
    els.menu.classList.remove('show');
  });
  document.getElementById('menuNewBtn').addEventListener('click', function () {
    els.menu.classList.remove('show');
    newGame();
  });
  document.getElementById('menuStatsBtn').addEventListener('click', function () {
    els.menu.classList.remove('show');
    renderStats();
    els.stats.classList.add('show');
  });
  document.getElementById('modeSeg').addEventListener('click', function (e) {
    var btn = e.target.closest('button'); if (!btn) return;
    if (btn.dataset.mode === state.mode) return;
    state.mode = btn.dataset.mode;
    localStorage.setItem('los_mode', state.mode);
    syncMenu();
    newGame();
  });
  document.getElementById('diffSeg').addEventListener('click', function (e) {
    var btn = e.target.closest('button'); if (!btn) return;
    if (btn.dataset.diff === state.diff) return;
    state.diff = btn.dataset.diff;
    localStorage.setItem('los_diff', state.diff);
    syncMenu();
    newGame();
  });
  document.getElementById('targetSeg').addEventListener('click', function (e) {
    var btn = e.target.closest('button'); if (!btn) return;
    if (btn.dataset.target === state.target) return;
    state.target = btn.dataset.target;
    localStorage.setItem('los_target', state.target);
    syncMenu();
    newGame();
  });
  document.getElementById('soundSeg').addEventListener('click', function (e) {
    var btn = e.target.closest('button'); if (!btn) return;
    state.sound = btn.dataset.sound === 'on';
    localStorage.setItem('los_sound', state.sound ? 'on' : 'off');
    syncMenu();
    if (state.sound) sndClick();
  });
  document.getElementById('musicSeg').addEventListener('click', function (e) {
    var btn = e.target.closest('button'); if (!btn) return;
    var want = btn.dataset.music === 'on';
    if (want === state.music) return;
    state.music = want;
    localStorage.setItem('los_music', state.music ? 'on' : 'off');
    syncMenu();
    if (state.music) musicStart(); else musicStop();
  });
  document.getElementById('melodySeg').addEventListener('click', function (e) {
    var btn = e.target.closest('button'); if (!btn) return;
    if (btn.dataset.melody === state.melody) return;
    state.melody = btn.dataset.melody;
    localStorage.setItem('los_melody', state.melody);
    syncMenu();
    if (music.on) { musicStop(); musicStart(); }  // перезапускаем с новой мелодией
  });
  /* Громкость музыки: ползунок 0–100, меняет общий гейн музыкальной шины */
  var volumeRange = document.getElementById('volumeRange');
  function paintVolume() {
    volumeRange.value = Math.round(state.volume * 100);
    volumeRange.style.setProperty('--fill', Math.round(state.volume * 100) + '%');
  }
  paintVolume();
  volumeRange.addEventListener('input', function () {
    state.volume = volumeRange.value / 100;
    localStorage.setItem('los_volume', String(state.volume));
    volumeRange.style.setProperty('--fill', volumeRange.value + '%');
    if (music.bus && actx) music.bus.gain.setTargetAtTime(state.volume, actx.currentTime, 0.1);
  });
  /* Музыка: браузеры разрешают звук только после жеста пользователя —
     если музыка включена, стартуем при первом касании экрана */
  document.addEventListener('pointerdown', function () {
    if (state.music && !music.on) musicStart();
  }, { once: true });
  /* Автопауза при сворачивании вкладки */
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && !state.locked && state.moves > 0 && !state.paused) pauseGame();
  });
  document.getElementById('closeStatsBtn').addEventListener('click', function () {
    els.stats.classList.remove('show');
  });
  document.getElementById('resetStatsBtn').addEventListener('click', function () {
    if (!confirm('Сбросить все рекорды и список побед?')) return;
    Object.keys(localStorage).forEach(function (k) {
      if (k.indexOf('los_best_') === 0) localStorage.removeItem(k);
    });
    localStorage.removeItem('los_wins');
    renderStats(); renderBest();
  });
  [els.win, els.stats, els.pause, els.menu].forEach(function (ov) {
    ov.addEventListener('click', function (e) { if (e.target === ov) ov.classList.remove('show'); });
  });

  /* ---------- Service worker (только по http/https) ---------- */
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    // новая версия SW активировалась и перехватила контроль — один раз перезагружаемся,
    // чтобы пользователь сразу видел свежую версию вместо старой из кэша
    var refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (refreshing) return;
      refreshing = true;
      location.reload();
    });
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }

  syncMenu();
  renderLevels();
  updateIncense();
  newGame();
})();
</script>
</body>
</html>
